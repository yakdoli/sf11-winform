<h3 style="tab-stops: 0pt">Create, Open and Save Excel Document </h3>
<p class="BodyText1">Spreadsheet control supports you to create the Excel 
documents without having the Microsoft Excel in your system. Also you can able 
to open the existing Excel documents in Spreadsheet control and modify and save 
the contents in the Excel documents.</p>
