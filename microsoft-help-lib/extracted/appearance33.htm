<h4 style="tab-stops: 0pt">Appearance</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'"></span> </p>
<p class="MsoNormal">The waiting pop-up control supports built-in themes that are 
suitable for a variety of layouts. Waiting pop-up image, background color, and 
transparency can be customized using Syncfusion themes or a  custom 
themes.</p>
