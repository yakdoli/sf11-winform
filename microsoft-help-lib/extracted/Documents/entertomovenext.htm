<h5><a name="_EnterToMoveNext_1" id="_EnterToMoveNext_1"></a>EnterToMoveNext</h5>
<p class="BodyText1">If you press the Enter key in DoubleTextBox the Focus moves 
to the next element in the application. To enable this feature you have to set 
<b>EnterToMoveNext </b>property to True.</p><span id="related-topics"></span></div></body></html>
