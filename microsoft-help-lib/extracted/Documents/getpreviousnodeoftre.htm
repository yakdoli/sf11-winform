<h4><a name="_How_to_GetPreviousNode" id="_How_to_GetPreviousNode"></a>GetPreviousNode of TreeViewItemAdv</h4>
<p class="BodyText1"><span style="FONT-FAMILY: 'Calibri','sans-serif'; FONT-SIZE: 11pt">                
</span><b>GetPreviousNode() </b>method returns the previous node of the Selected 
TreeViewItemAdv. By passing TreeViewItemAdv as argument for this function, ypu 
can get the previous node of a particular item.</p><span id="related-topics"></span></div></body></html>
