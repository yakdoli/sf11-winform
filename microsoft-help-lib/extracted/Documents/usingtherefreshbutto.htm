<h4>Using the Refresh button</h4>
<p class="BodyText1">At the right side of the HierarchyNavigator control, the 
Refresh button is available. By clicking the Refresh button, the 
<b>HierarchyNavigatorRefreshButtonClick</b> event will be fired.</p>
