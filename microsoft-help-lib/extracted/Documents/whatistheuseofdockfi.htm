<h4>What is the use of DockFill mode</h4>
<p class="BodyText1"> </p>
<p class="BodyText1">The <b>DockToFill</b> property allows you to implement a very 
unique docking layout. ContainerControl's entire client region is occupied by 
the dockable controls.</p>
