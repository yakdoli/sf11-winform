<h4><a name="_Window_State_1" id="_Window_State_1"></a>Window State</h4>
<p class="BodyText1">The State of the Windows can be controlled by the property 
<i>WindowState</i>. The <i>Enum</i> takes the following values:</p>
<p style="tab-stops: 36.0pt" class="BulletedList"><span style="FONT-FAMILY: Symbol">·      </span>Minimized</p>
<p style="tab-stops: 36.0pt" class="BulletedList"><span style="FONT-FAMILY: Symbol">·      </span>Maximized</p>
<p style="tab-stops: 36.0pt" class="BulletedList"><span style="FONT-FAMILY: Symbol">·      </span>Normal</p>
