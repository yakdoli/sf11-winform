<h5><a name="_Activate_Window_Control" id="_Activate_Window_Control"></a>Activate Window Control</h5>
<p class="BodyText1">The Window Control can be activated using the property 
<i>BringToFront()</i>. This method brings the WindowControl to front if there is 
more than one Window Control.</p>

      <p style="TEXT-AUTOSPACE: " class="MsoNormal"><span style="FONT-FAMILY: Consolas; FONT-SIZE: 9.5pt">window.BringToFront();</span></p></td></tr></tbody></table>
