<h4><a name="_Ref261547477" id="_Ref261547477"></a><a name="_Freeze_the_layout" id="_Freeze_the_layout"></a>Freeze the 
layout</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'"></span> </p>
<p class="BodyText1">The entire layout can be frozen by setting 
<b>FreezeLayout</b> property. When this property is set to False we cannot 
resize all the windows.</p>
<p class="BodyText1">Refer also:</p>
<p class="BodyText1"><u><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"><a><u></u>Prevent 
resizing of docking windows<u><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"></span></u><u></u></a></span></u><u></u><u><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"></span></u></p>
<p class="BodyText1"><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"></span> </p><span id="related-topics"></span></div></body></html>
