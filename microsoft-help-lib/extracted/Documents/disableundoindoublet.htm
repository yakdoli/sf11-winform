<h4>Disable Undo in DoubleTextBox</h4>
<p class="BodyText1"> </p>
<p class="BodyText1">Undo operation in DoubleTextBox can be disabled by setting 
<b>IsUndoEnabled </b>property to False.</p><span id="related-topics"></span></div></body></html>
