<h2 style="LINE-HEIGHT: 115%; TEXT-INDENT: -28.8pt; MARGIN: 10pt 0pt 0pt 28.8pt"><span style="LINE-HEIGHT: 115%">TimeSpanEdit</span></h2>
<p class="BodyText1">TimeSpanEdit control displays time as Days: Hour: Min: Sec 
format. The fields can be incremented or decremented using the up/down keys. 
</p>
