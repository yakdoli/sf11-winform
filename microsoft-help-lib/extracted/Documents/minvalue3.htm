<h5><a name="_MinValue_2" id="_MinValue_2"></a>MinValue</h5>
<p class="BodyText1"><b>Minimum allowed value for </b>CurrencyTextBox- If new 
MinValue property value is greater than the <b>MaxValue</b> property value, then 
the MaxValue is set equal to the MinValue. If the Value is less than the new 
MinValue, the <b>Value</b> property is also set equal to the MinValue.</p><span id="related-topics"></span></div></body></html>
