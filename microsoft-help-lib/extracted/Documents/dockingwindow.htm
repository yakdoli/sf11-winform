<h4>Docking Window</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'"></span> </p>
<p class="BodyText1">A Window can be docked in any complex layout using 
DockingManager. It can also be tabbed inside another window.</p>
