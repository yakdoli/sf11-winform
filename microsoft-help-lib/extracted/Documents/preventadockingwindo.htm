<h4><a name="_Ref261511100" id="_Ref261511100"></a><a name="_Prevent_a_docking" id="_Prevent_a_docking"></a>Prevent a docking 
window to a particular side</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'"></span> </p>
<p class="BodyText1">This can be achieved by controlling the visibility of the 
drag providers. Visibility of individual drag indicator can be controlled by 
<b>DockAbility</b> property.</p>
<p class="BodyText1">Refer Also,</p>
<p class="BodyText1"><span class="UGHyperlink"> </span><span class="UGHyperlink"><a><span class="UGHyperlink"></span><span class="UGHyperlink">Drag 
Providers</span><span class="UGHyperlink"></span></a></span><span class="UGHyperlink"></span><i><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"> </span></i>to 
know about DockAbility<span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 14pt"></span></p><span id="related-topics"></span></div></body></html>
