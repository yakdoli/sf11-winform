<h4>Enable the ClickHeaderToMaximize</h4>
<p class="BodyText1">You can enable the ClickHeaderToMaximize feature by using the 
<b>ClickHeaderToMaximize</b> property through C# as below. <a href="../../../../../../../../Documents%20and%20Settings/riaj/Desktop/styling%20for%20ui%20silverlight/tools%20silverlight/tools%20part%202.docx#_Click_Header_to"><span style="COLOR: blue">Refer to the Detailed sample</span></a><u><span style="COLOR: blue">.</span></u></p>
