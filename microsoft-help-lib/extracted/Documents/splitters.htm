<h4>Splitters</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'"></span> </p>
<p class="BodyText1">Each docked window will be separated from the other docked 
window by <b>Splitters</b>. A Window can be resized using these splitters. We 
can also change the background color of the splitter. </p>
<p class="BodyText1">Refer <span class="UGHyperlink"><a><span class="UGHyperlink"></span><span class="UGHyperlink">SplitterBackgroundColor</span><span class="UGHyperlink"></span></a></span><span class="UGHyperlink"></span><span class="UGHyperlink"></span></p><span id="related-topics"></span></div></body></html>
