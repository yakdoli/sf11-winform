<h5 style="tab-stops: 0pt">MinValue</h5>
<p style="MARGIN-LEFT: 18pt" class="BodyText1"> </p>
<p style="MARGIN-LEFT: 18pt" class="BodyText1">Minimum allowed value for the 
IntegerTextBox. If the new MinValue property value is greater than the MaxValue 
property value, then the MaxValue is set equal to the MinValue. If the Value is 
less than the new MinValue, then the Value property is also set equal to the 
MinValue.</p>
