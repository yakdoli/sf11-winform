<h5 style="tab-stops: 0pt">MaxValue</h5>
<p style="MARGIN-LEFT: 18pt" class="BodyText1"> </p>
<p style="MARGIN-LEFT: 18pt" class="BodyText1">Maximum allowed value for the 
IntegerTextBox. If the MinValue property is greater than the new MaxValue 
property, then the MinValue property value is set equal to the MaxValue. If the 
current Value is greater than the new MaxValue, then the Value property is set 
equal to the Maxvalue.</p>
