<h4 style="tab-stops: 0pt">Appearance</h4>
<p class="MsoNormal">Captcha supports in-built themes that gives high visual 
appeal and are suitable for varied layouts. Apart from this, the captcha theme 
can be customized through a set of properties.</p>
