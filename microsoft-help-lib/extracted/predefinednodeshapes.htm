<h4 style="tab-stops: 0pt">Predefined Node Shapes </h4>
<p class="BodyText10">A node can be assigned with a shape using the <b>Shape</b> 
property. Several built-in shapes are provided. The user can select from any one 
of the built-in shapes.</p>
