<h5 style="tab-stops: 0pt">Through Visual Studio </h5>
<p class="BodyText1">To create the CardView control through Visual Studio, drag 
the <b>CardView</b> from the <b>Toolbox</b> and drop it in the Designer area. It 
will generate the CardView control.</p>
