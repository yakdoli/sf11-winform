<h4 style="tab-stops: 0pt">How to filter data using the filter expressions?</h4>
<p class="BodyText1">Filter Tokens are the symbols which are used in filter 
expressions to filter data as you require.</p>
<p class="BodyText1">Refer to <a>Filter Tokens</a> to learn more about them. </p>
<p class="BodyText1">Use these filter tokens in the filter bar as you require, to 
filter data according to your needs.</p>
