<h4 style="tab-stops: 0pt">ToolTip</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'; FONT-SIZE: 11pt"></span> </p>
<p class="BodyText1">The OLAP Chart for WPF provides series information (Measure, 
Primary x-axis and y-axis values, and series name) through Series ToolTips, when 
the mouse pointer is moved over chart points.</p>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'; FONT-SIZE: 11pt"></span> </p>
