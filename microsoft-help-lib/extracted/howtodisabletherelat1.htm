<h4 style="TEXT-ALIGN: justify; tab-stops: 0pt">How to Disable the Relative 
Reference Copy and Paste</h4>
<p class="MsoNormal">By default, this feature is enabled in the Spreadsheet 
control. You can disable this copy paste feature by using the following 
code:</p>
<p class="MsoNormal"> </p>
<table style="BORDER-BOTTOM: medium none; BORDER-LEFT: medium none; BORDER-COLLAPSE: collapse; BACKGROUND: #f2f2f2; BORDER-TOP: medium none; BORDER-RIGHT: medium none" class="MsoTableGrid" border="1" cellspacing="0" cellpadding="0">
  <tbody>
  <tr>
    <td style="BORDER-BOTTOM: #c8c8c8 1pt solid; BORDER-LEFT: #c8c8c8 1pt solid; PADDING-BOTTOM: 0pt; PADDING-LEFT: 5.75pt; WIDTH: 468pt; PADDING-RIGHT: 5.75pt; BORDER-TOP: #c8c8c8 1pt solid; BORDER-RIGHT: #c8c8c8 1pt solid; PADDING-TOP: 0pt" valign="top" width="624">
      <p style="TEXT-AUTOSPACE: " class="MsoNormal"><b><span style="FONT-FAMILY: 'Courier New'">[C#]</span></b></p>
      <p style="TEXT-AUTOSPACE: " class="MsoNormal"><span style="FONT-FAMILY: 'Courier New'">spreadsheetControl.GridProperties.ActiveSpreadsheetGrid.Model.GridCopyPaste 
      = <span style="BACKGROUND: #f2f2f2; COLOR: blue">null</span>;</span></p></td></tr></tbody></table>
<p style="LINE-HEIGHT: 115%" class="BodyText10"><b></b> </p><span id="related-topics"></span></div></body></html>
