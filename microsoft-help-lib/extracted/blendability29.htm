<h4 style="tab-stops: 0pt">Blendability</h4>
<p class="MsoNormal">The GridTree control supports setting its styles by XAML and 
through Microsoft Expression Blend<span style="COLOR: #c00000">.  
</span></p>
<p class="BodyTextHeading">Use Case Scenarios</p>
<p style="LINE-HEIGHT: 115%; TEXT-AUTOSPACE: " class="MsoNormal"><span style="COLOR: black">This feature allows the GridTree control to be customized 
through </span>Microsoft Expression Blend 3 or 4.</p>
