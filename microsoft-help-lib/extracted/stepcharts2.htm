<h5 style="tab-stops: 0pt">Step Charts</h5>
<p class="BodyText1">Step Charts are similar to regular charts except that the 
values are drawn continuously, step by step without any gaps in-between<span style="FONT-SIZE: 12pt">. </span></p>
<p class="BodyText1"> </p>
<p class="BodyText1">There are two types of step charts.</p>
