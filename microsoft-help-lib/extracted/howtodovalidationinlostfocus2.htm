<h4 style="tab-stops: 0pt">How to do Validation in Lost Focus</h4>
<p style="MARGIN-LEFT: 18pt" class="BodyText1">To do Validation in Lost Focus you 
have to set the MinValidation and MaxValidation properties to 
MinValidation.OnLostFocus and MaxValidation.OnLostFocus.</p>
