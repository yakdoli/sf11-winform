<h4 style="tab-stops: 0pt">Ticker</h4>
<p style="TEXT-AUTOSPACE: " class="MsoNormal"> </p>
<p class="MsoNormal">The Ticker control displays its text, character by character 
at a specified interval, iteratively thereby creating a typewriter text 
effect.</p>
<div style="BORDER-BOTTOM: windowtext 1pt solid; BORDER-LEFT: medium none; PADDING-BOTTOM: 1pt; MARGIN-TOP: 9pt; PADDING-LEFT: 0pt; PADDING-RIGHT: 0pt; MARGIN-BOTTOM: 9pt; BORDER-TOP: windowtext 1pt solid; BORDER-RIGHT: medium none; PADDING-TOP: 1pt">
<p style="MARGIN-TOP: 0pt; MARGIN-BOTTOM: 0pt" class="Note">Note:<span style="COLOR: black; FONT-SIZE: 8pt"> </span>The Ticker control can be hosted in 
Safari browser too.</p></div>
