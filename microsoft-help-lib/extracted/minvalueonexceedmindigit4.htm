<h5 style="tab-stops: 0pt">MinValueOnExceedMinDigit</h5>
<p class="BodyText1"> </p>
<p class="BodyText1">If this property is set to true, then when you enter a value 
less than the MinValue then it will automatically assign the MinValue to the 
Value property. Otherwise it will not allow the key press.</p>
<div style="BORDER-BOTTOM: windowtext 1pt solid; BORDER-LEFT: medium none; PADDING-BOTTOM: 1pt; MARGIN-TOP: 9pt; PADDING-LEFT: 0pt; PADDING-RIGHT: 0pt; MARGIN-BOTTOM: 9pt; BORDER-TOP: windowtext 1pt solid; BORDER-RIGHT: medium none; PADDING-TOP: 1pt">
<p style="MARGIN-TOP: 0pt" class="Note">Note: This will be enabled only when 
MinValidation is set to OnKeyPress.</p>
<p class="Note"> </p>
<p style="MARGIN-BOTTOM: 0pt" class="Note"> </p></div><span id="related-topics"></span></div></body></html>
