<h5 style="tab-stops: 0pt">Binding to OLAP Data</h5>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Calibri','sans-serif'; FONT-SIZE: 11pt"></span> </p>
<p class="BodyText1">OlapData can be bound to the OlapGrid with the help of the 
OlapDataManager. The OlapDataManager requires the OlapReport, which contains the 
Dimension and the Measure Elements.</p>
