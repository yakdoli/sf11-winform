<h4 style="tab-stops: 0pt">Keyboard and Mouse support</h4>
<p class="BodyText1">Up or down arrows in the CurrencyTextBox spin the values one 
step up or down. Mouse Scroll in the CurrencyTextBox spin values one step up or 
down. The spin behavior in the CurrencyTextBox can be enabled by setting the 
IsScrollingOnCircle property to true.</p>
