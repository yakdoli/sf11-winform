<h4 style="tab-stops: 0pt"> Disable Editing</h4>
<p class="MsoNormal">You can disable editing in <b>RichTextBoxAdv</b> by enabling 
the property called <b>IsReadOnly</b>.<b> </b>It will not allow the user to edit 
the content.</p>
