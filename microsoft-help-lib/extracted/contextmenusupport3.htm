<h4 style="tab-stops: 0pt">Context Menu Support</h4>
<p class="MsoNormal">RichTextBoxAdv supports a context menu similar to MS Word. It 
supports the following list of features in its context menu:</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">1.  Cut</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">2.  Copy</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">3.  Paste</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">4.  Insert Table</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">5.  Font</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">6.  Paragraph</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">7.  Bullets</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">8.  Numbering</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal">9.  Hyperlink</p>
<p class="Figure"><img border="0" alt="Description: C:\Users\labuser\Desktop\Rich\contextmenu.png" src="ImagesExt/image30_807.png" /></p>
