<h4 style="tab-stops: 0pt">Enabling Excel-Like Editing in MVC Grid</h4>
<p class="MsoNormal"> </p>
<p class="MsoNormal">A grid can be rendered in two ways:</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal"><span style="FONT-FAMILY: Symbol">·      </span>Through 
server mode</p>
<p style="TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="MsoNormal"><span style="FONT-FAMILY: Symbol">·      </span>Through JSON 
mode</p>
<p class="MsoNormal">Out of these two modes, Excel-like editing is only supported 
by the JSON mode.</p>
