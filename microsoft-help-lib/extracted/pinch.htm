<h4 style="tab-stops: 0pt">Pinch</h4>
<p class="BodyText1"> </p>
<p class="BodyText1">The Map gets zoomed, when <i>Pinch</i> on the map. When pinch 
ratio increased the Map will get zoomed, if Pinch ration is decreased the Map 
will be zoomed out.</p>
