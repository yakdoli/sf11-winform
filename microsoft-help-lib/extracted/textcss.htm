<h4 style="tab-stops: 0pt"><span style="FONT-SIZE: 10pt"></span><a name="p136" id="p136"></a>Text – CSS</h4>
<p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 9pt" class="MsoNormal"><span style="FONT-FAMILY: 'Trebuchet MS','sans-serif'; COLOR: #15428b; FONT-SIZE: 9pt"></span> </p>
<p class="BodyText1">The <b>text</b> attribute in CSS helps the user to set 
properties for his text display. With these properties the appearance of the 
text can be modified according to the users requirements.</p>
