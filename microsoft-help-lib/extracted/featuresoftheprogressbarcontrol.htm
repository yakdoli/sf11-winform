<h4 style="tab-stops: 0pt">Features of the ProgressBar Control</h4>
<p class="MsoNormal">The various features of the ProgressBar control are 
associated with the properties of the control. This section will help you 
understand the use of these properties in detail, and will help you on how to 
implement, disable, or customize them in the Control.</p><span id="related-topics"></span></div></body></html>
