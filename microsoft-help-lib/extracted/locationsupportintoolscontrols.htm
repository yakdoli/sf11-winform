<h4 style="tab-stops: 0pt">Location Support in Tools Controls</h4>
<p style="LINE-HEIGHT: 115%" class="BodyText10">The following cultures are 
supported by Essential Tools for Windows Phone controls.</p>
<p style="LINE-HEIGHT: 115%; TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="BodyText10">1.   en-US</p>

<p style="LINE-HEIGHT: 115%; TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="BodyText10">3.   it-IT</p>
<p style="LINE-HEIGHT: 115%; TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="BodyText10">4.   fr-FR</p>
<p style="LINE-HEIGHT: 115%; TEXT-INDENT: -18pt; MARGIN-LEFT: 36pt; tab-stops: 36.0pt" class="BodyText10">5.   de-DE</p><span id="related-topics"></span></div></body></html>
