<h4 style="tab-stops: 0pt">How to do Validation in Lost Focus</h4>
<p class="MsoNormal"><span style="FONT-FAMILY: 'Trebuchet MS','sans-serif'; COLOR: #15428b; FONT-SIZE: 9pt"></span> </p>
<p class="BodyText1">To do Validation in Lost Focus you have to set the 
MinValidation and MaxValidation properties to MinValidation.OnLostFocus and 
MaxValidation.OnLostFocus.</p>
<p class="MsoNormal"><b><span style="FONT-FAMILY: 'Trebuchet MS','sans-serif'; COLOR: #15428b; FONT-SIZE: 9pt"></span></b> </p>
