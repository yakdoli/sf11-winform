<h5 style="tab-stops: 0pt">MaxValue</h5>
<p class="BodyText1"> </p>
<p class="BodyText1">Maximum allowed value for the CurrencyTextBox. If the 
MinValue property is greater than the new MaxValue property, then the MinValue 
property value is set equal to the MaxValue. If the current Value is 
greater<span style="COLOR: black"> than </span>the new MaxValue, then the Value 
property is set equal to the Maxvalue.</p>
