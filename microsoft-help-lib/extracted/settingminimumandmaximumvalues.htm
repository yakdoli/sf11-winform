<h4 style="MARGIN-LEFT: 18pt; tab-stops: 18.0pt">Setting Minimum and Maximum 
values</h4>
<p style="MARGIN-LEFT: 18pt" class="BodyText1"> </p>
<p style="MARGIN-LEFT: 18pt" class="BodyText1">These properties specify the 
Minimum and Maximum bounds of the RangeSlider control till which the channel 
extends.</p>
<p style="MARGIN-LEFT: 18pt" class="BodyText1"> </p>
<p style="MARGIN-LEFT: 18pt" class="BodyText1">In the following example the 
maximum bound is set to 10. </p>
<p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 27pt" class="MsoNormal"><span style="COLOR: #15428b"></span> </p>
<table style="BORDER-BOTTOM: #c8c8c8 1pt solid; BORDER-LEFT: #c8c8c8 1pt solid; MARGIN-LEFT: 2.25pt; BORDER-TOP: #c8c8c8 1pt solid; BORDER-RIGHT: #c8c8c8 1pt solid" class="MsoNormalTable" border="1" cellspacing="0" cellpadding="0" width="100%">

  <tr style="HEIGHT: 31.5pt">
    <td style="BORDER-BOTTOM: white 1pt solid; BORDER-LEFT: white 1pt solid; PADDING-BOTTOM: 1.5pt; PADDING-LEFT: 1.5pt; WIDTH: 465.75pt; PADDING-RIGHT: 1.5pt; BACKGROUND: #f0f0f0; HEIGHT: 31.5pt; BORDER-TOP: white 1pt solid; BORDER-RIGHT: white 1pt solid; PADDING-TOP: 1.5pt" valign="top" width="621">
      <p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 18pt" class="MsoNormal"><b><span style="FONT-FAMILY: 'Courier New'; COLOR: black">[C#]</span></b></p>
      <p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 18pt" class="MsoNormal"><b><span style="FONT-FAMILY: 'Courier New'; COLOR: black"></span></b> </p>
      <p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 18pt" class="MsoNormal"><span style="FONT-FAMILY: 'Courier New'">rangeSlider.Maximum = 20;</span></p>
      <p style="TEXT-AUTOSPACE: ; MARGIN-LEFT: 18pt" class="MsoNormal"><span style="FONT-FAMILY: 'Courier New'">rangeSlider.Minimum = 0;</span><span style="FONT-FAMILY: 'Courier New'"></span></p></td></tr></tbody></table>
