<h3>4.3.1 Applying Styles to the Table <span style="FONT-FAMILY: 'Cambria','serif'"></span></h3>
<p style="PAGE-BREAK-AFTER: avoid; tab-stops: 0pt" class="MsoNormal">You can apply 
styles to cells of the table using the <b>Properties </b>grid or 
<b>Properties</b> dialog. To change the background color of a cell, select a 
color that you want to apply from the <b>Fill Color</b> drop-down combo box.</p>
