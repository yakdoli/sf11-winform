<h4 style="tab-stops: 0pt">Adding Connectors through Code Behind </h4>
<p class="BodyText10">We can create connections between nodes through Builder and 
properties model. The <b>Line Connector </b>class is used to create the 
connection. We need to specify the head node and the tail node for the 
connection.</p>
